<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebStudy AI | User Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Enter Your Profile</h1>

  <label>Education Level:</label>
  <input type="text" id="education" placeholder="College / School / University">

  <label>CGPA:</label>
  <input type="number" id="cgpa" step="0.01" placeholder="e.g. 8.0">

  <label>Interest Area:</label>
  <input type="text" id="interest" placeholder="AI/ML, Web Development, etc.">

  <label>Resume Score:</label>
  <input type="number" id="resumeScore" placeholder="0-100">

  <label>Skills:</label>
  <input type="text" id="skills" placeholder="Python, ML, JavaScript">

  
  <button class="next-btn" id="saveNextBtn">Next → Profile</button>
</div>

<script src="js/profile.js"></script>
</body>
</html>
