<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebsterAI | Internship Prediction</title>
    <!-- Google Font Integration -->
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h1>WebsterAI</h1>
    <p>AI Internship Predictor</p>
</header>

<div class="container">
    <h2>Internship Prediction</h2>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your Name">

    <label for="skills">Skills (comma separated)</label>
    <input type="text" id="skills" placeholder="Python, HTML, etc.">

    <label for="cgpa">CGPA</label>
    <input type="number" id="cgpa" placeholder="9.0">

    <label for="area">Interested Area</label>
    <select id="area">
        <option value="AI">AI</option>
        <option value="Web">Web Development</option>
        <option value="Cyber">Cyber Security</option>
        <option value="IoT">IoT</option>
    </select>

    <button onclick="predictInternship()">Predict Internship</button>
    <div id="predictionResult" class="result-box"></div>

    <button class="next-btn" onclick="window.location.href='resume.html'">Next → Resume Analyzer</button>
</div>

<script src="js/prediction.js"></script>
</body>
</html>
